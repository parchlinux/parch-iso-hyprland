config_version = 14

[bar.default]
capsule = true
center = [ "workspaces" ]
concave_edge_corners = false
end = [ "tray", "notifications", "clipboard", "bluetooth", "network", "volume", "battery", "session", "clock" ]
margin_ends = 0
radius = 0
start = [ "launcher", "wallpaper", "media" ]
thickness = 50

[calendar]
enabled = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@Virtual-1", "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-3"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 834.29998779296875
    output = "Virtual-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
font_family = "Google Sans"
lang = "en"
screen_time_enabled = true

    [shell.launcher]
    pinned = [ "parch-hyprland-cheatsheet" ]

    [shell.panel]
    launcher_placement = "attached"

    [shell.screen_corners]
    size = 1

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt" ]
    community_ids = [ "fastfetch" ]

[wallpaper]
directory = "/usr/share/wallpapers"

    [wallpaper.default]
    path = "/usr/share/wallpapers/Parch/W2.jpg"

    [wallpaper.last]
    path = "/usr/share/wallpapers/Parch/W2.jpg"

    [wallpaper.monitors.Virtual-1]
    path = "/usr/share/wallpapers/Parch/W2.jpg"

[widget.workspaces]
show_labels = false
